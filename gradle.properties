# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Lets the shared iosMain source set see the libPhoneNumber-iOS cinterop bindings, which are
# otherwise visible only to the per-target (iosArm64 / iosSimulatorArm64) source sets.
kotlin.mpp.enableCInteropCommonization=true
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# Dokka Gradle Plugin v2 (the `dokka {}` DSL used in ccp/build.gradle.kts).
org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
org.jetbrains.dokka.experimental.gradle.pluginMode.noWarn=true

# --- Maven coordinates -----------------------------------------------------------------
# Read by the Vanniktech publish plugin (ccp/build.gradle.kts) and by the Dokka version label,
# so the published artifact, the docs site and the README always agree on one version number.
# GROUP is an io.github.* coordinate because that is the namespace GitHub ownership verifies
# for Maven Central; JitPack ignores it and republishes under com.github.EzekielWachira.
GROUP=io.github.ezekielwachira
POM_ARTIFACT_ID=ccp
VERSION_NAME=0.3.0

# Vanniktech defaults that suit an Android library: publish sources and a Dokka-generated
# javadoc jar, both required by Maven Central.
SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true

# POM metadata. Maven Central rejects a bundle missing any of name/description/url/licence/
# developer/SCM, so these live here rather than in the build script where they are easy to
# forget until a release fails validation.
POM_NAME=Country Code Picker
POM_DESCRIPTION=A Jetpack Compose country picker and phone number input with libphonenumber-backed validation, E.164 output, search, region filters and full theming.
POM_INCEPTION_YEAR=2025
POM_URL=https://github.com/EzekielWachira/Country-Code-Picker

POM_LICENSE_NAME=The MIT License
POM_LICENSE_URL=https://github.com/EzekielWachira/Country-Code-Picker/blob/main/LICENSE.md
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/EzekielWachira/Country-Code-Picker
POM_SCM_CONNECTION=scm:git:git://github.com/EzekielWachira/Country-Code-Picker.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/EzekielWachira/Country-Code-Picker.git

POM_DEVELOPER_ID=EzekielWachira
POM_DEVELOPER_NAME=Ezekiel Wachira
POM_DEVELOPER_URL=https://github.com/EzekielWachira
