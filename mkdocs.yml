site_name: Country Code Picker
site_description: >-
  A Jetpack Compose library for country selection, phone country codes, phone number validation
  and real-time formatting.
site_author: Ezekiel Wachira
site_url: https://ezekielwachira.github.io/Country-Code-Picker/
repo_url: https://github.com/EzekielWachira/Country-Code-Picker
repo_name: EzekielWachira/Country-Code-Picker
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025 Ezekiel Wachira &middot; MIT License

theme:
  name: material
  language: en
  icon:
    logo: material/earth
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/EzekielWachira/Country-Code-Picker
      name: Source on GitHub
    - icon: material/package-variant
      link: https://jitpack.io/#EzekielWachira/Country-Code-Picker
      name: Releases on JitPack

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

# The API reference is generated by Dokka (./gradlew :ccp:dokkaGenerate) and copied into
# site/api/ after `mkdocs build` — see .github/workflows/docs.yml. The nav entry below is a
# plain link to that directory, so MkDocs must not treat it as a missing page.
validation:
  nav:
    not_found: info
  links:
    absolute_links: ignore

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Country picker:
      - country-picker/index.md
      - Country selector: country-picker/selector.md
      - Configuration: country-picker/configuration.md
      - Multi-selection: country-picker/multi-select.md
      - Country detection: country-picker/detection.md
      - Data, search and recents: country-picker/data.md
  - Phone numbers:
      - phone/index.md
      - Phone number field: phone/field.md
      - Validation and formatting: phone/validation.md
      - Phone verification: phone/verification.md
  - Theming: theming.md
  - Accessibility: accessibility.md
  - Legacy API:
      - legacy/index.md
      - PhoneNumberInput: legacy/phone-number-input.md
      - Migration guide: legacy/migration.md
  - API reference: api/index.html
