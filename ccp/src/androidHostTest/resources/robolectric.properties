# The SDK level Robolectric emulates for the screenshot suite.
#
# Not compileSdk (36): Robolectric ships a pre-built android-all jar per API level and 4.17's newest
# is 35, so leaving this to default to the module's targetSdk fails in DefaultSdkProvider before any
# test runs. Pinning it also makes the goldens stable — a Robolectric upgrade that adds a new SDK
# must not silently re-render every screenshot.
sdk=35
